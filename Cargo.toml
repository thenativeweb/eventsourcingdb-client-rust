[package]
name = "eventsourcingdb"
version = "4.0.3"
edition = "2024"
rust-version = "1.88"
description = "A client library for the EventsourcingDB by the native web."
repository = "https://github.com/thenativeweb/eventsourcingdb-client-rust"
license = "MIT"
keywords = [
  "esdb",
  "events",
  "event-sourcing",
  "event-store",
  "cqrs",
]
categories = ["database"]

[features]
default = []
cloudevents = ["dep:cloudevents-sdk"]
polars = ["dep:polars"]
testcontainer = ["dep:testcontainers", "dep:rand", "dep:log", "ed25519-dalek/rand_core", "tokio/rt"]

[dependencies]
bytes = "1.11.1"
chrono = { version = "0.4.45", features = ["serde"] }
cloudevents-sdk = { version = "0.9.0", features = ["reqwest"], optional = true }
futures = "0.3.32"
futures-util = "0.3.31"
h2 = "0.4.10"
http = "1.3.1"
http-body = "1.0.1"
jsonschema = "0.33.0"
log = { version = "0.4.27", optional = true }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["raw_value"] }
testcontainers = { version = "0.28.0", optional = true }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["io-util", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tokio-stream = { version = "0.1.18", features = ["io-util"] }
typed-builder = "0.23.2"
url = "2.5.4"
sha2 = "0.11.0"
hex = "0.4.3"
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "pkcs8", "pem"] }
rand = { version = "0.10", optional = true }
polars = { version = "0.55", default-features = false, features = ["lazy", "dtype-datetime"], optional = true }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["full"] }
tokio-test = "0.4.5"

# This is metadata required for working docs on docs.rs
[package.metadata.docs.rs]
features = ["testcontainer"]
