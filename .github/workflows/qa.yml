name: QA

on: pull_request

concurrency:
  group: qa-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Clone repository
      uses: actions/checkout@v7.0.1
    - name: Use Rust
      uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
      with:
        toolchain: stable
        components: clippy, rustfmt
        cache: false
        build-warnings: ""
    - name: Run QA
      run: make qa
