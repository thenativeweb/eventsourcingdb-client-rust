name: QA

on: pull_request

concurrency:
  group: qa-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA (${{ matrix.image-tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        image-tag: [ latest, preview ]

    env:
      EVENTSOURCINGDB_IMAGE_TAG: ${{ matrix.image-tag }}

    steps:
    - name: Clone repository
      uses: actions/checkout@v7.0.1
    - name: Use Rust
      uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
      with:
        toolchain: stable
        components: clippy, rustfmt
        cache: false
        build-warnings: ""
    - name: Run QA
      run: make qa

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # The polars feature needs a newer Rust than the crate itself, because
      # of sysinfo. This must match the README line about the polars feature.
      POLARS_RUST_VERSION: "1.95"

    steps:
    - name: Clone repository
      uses: actions/checkout@v7.0.1
    - name: Read minimum Rust version
      run: |
        msrv=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version // empty')
        test -n "$msrv"
        echo "MSRV=$msrv" >> "$GITHUB_ENV"
    - name: Use Rust
      uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
      with:
        toolchain: ${{ env.MSRV }}, ${{ env.POLARS_RUST_VERSION }}
        cache: true
        build-warnings: ""
    - name: Check with the minimum Rust version
      run: cargo +"$MSRV" check --locked --features cloudevents,testcontainer
    - name: Check the polars feature
      run: cargo +"$POLARS_RUST_VERSION" check --locked --features polars
